name: Bootstrap and Build Chérie Read APK

on:
  push:
    branches: [ main ]
    paths:
      - 'CherieRead-v1.3.3-GitHub-APK-Project.zip'
      - '.github/workflows/bootstrap-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="CherieRead-v1.3.3-GitHub-APK-Project.zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "Please upload $ARCHIVE to the repository root, then run this workflow."
            exit 1
          fi
          unzip -t "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/cherie"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/cherie"
          cp -a "$RUNNER_TEMP/cherie/." .
          # The archive contains the normal build workflow, but this bootstrap
          # token cannot push changes under .github/workflows. Install it later
          # via the GitHub Contents API after this source commit succeeds.
          rm -f .github/workflows/build-apk.yml

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Keep the already-installed bootstrap workflow untouched in this push.
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Unexpected workflow-file change staged; refusing to push."
            exit 1
          fi
          git commit -m "Add Chérie Read v1.3.3 Android project [skip ci]"
          git push origin HEAD:main

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CherieRead-Android-APK-v1.3.3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
