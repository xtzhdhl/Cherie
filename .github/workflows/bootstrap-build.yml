name: Bootstrap and Build Chérie Read APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'app/src/main/java/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand project ZIP when supplied
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="CherieRead-v1.3.3-GitHub-APK-Project.zip"
          if [[ -f "$ARCHIVE" ]]; then
            unzip -t "$ARCHIVE"
            mkdir -p "$RUNNER_TEMP/cherie"
            unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/cherie"
            cp -a "$RUNNER_TEMP/cherie/." .
            rm -f .github/workflows/build-apk.yml
            rm -f "$ARCHIVE"
          else
            echo "No bootstrap ZIP found; building the existing repository checkout."
          fi

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Unexpected workflow-file change staged; refusing to push."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No project changes to commit; continuing to build."
          else
            git commit -m "Add Chérie Read Android project [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore permanent signing keystore
        shell: bash
        env:
          CHERIE_KEYSTORE_BASE64: ${{ secrets.CHERIE_KEYSTORE_BASE64 }}
          CHERIE_SIGNING_PASSWORD: ${{ secrets.CHERIE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CHERIE_KEYSTORE_BASE64:-}" || -z "${CHERIE_SIGNING_PASSWORD:-}" ]]; then
            echo "::error::Missing CHERIE_KEYSTORE_BASE64 or CHERIE_SIGNING_PASSWORD. Add both Repository Secrets before building."
            exit 1
          fi
          printf '%s' "$CHERIE_KEYSTORE_BASE64" | base64 --decode > cherie-release.p12
          test -s cherie-release.p12
          chmod 600 cherie-release.p12
          keytool -list -keystore cherie-release.p12 -storetype PKCS12 -storepass "$CHERIE_SIGNING_PASSWORD" -alias cherie-release >/dev/null

      - name: Build APK with permanent signature
        env:
          CHERIE_SIGNING_PASSWORD: ${{ secrets.CHERIE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CHERIE_SIGNING_PASSWORD:-}" || { echo "::error::Missing CHERIE_SIGNING_PASSWORD."; exit 1; }
          gradle assembleDebug --no-daemon

      - name: Verify APK signature and certificate
        env:
          CHERIE_SIGNING_PASSWORD: ${{ secrets.CHERIE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APK_SIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -s "$APK"
          "$APK_SIGNER" verify --verbose "$APK"
          APK_CERT=$("$APK_SIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          KEY_CERT=$(keytool -exportcert -keystore cherie-release.p12 -storetype PKCS12 -storepass "$CHERIE_SIGNING_PASSWORD" -alias cherie-release | sha256sum | cut -d' ' -f1)
          echo "APK signing certificate: $APK_CERT"
          echo "Keystore certificate:     $KEY_CERT"
          test -n "$APK_CERT"
          test "$APK_CERT" = "$KEY_CERT"

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CherieRead-Android-APK-v1.3.5
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Release tag: v$VERSION_NAME"

      # Main-branch builds publish the version declared in Gradle.
      # Version-tag builds keep the same release workflow for future upgrades.
      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.app_version.outputs.tag }}
          target_commitish: main
          name: Chérie Read ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.app_version.outputs.tag }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
